<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Cybersecurity Awareness Game</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
  <link rel="stylesheet" href="sign-in.css">
</head>
<body>
    <canvas id="meshBg"></canvas>
    <!-- <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div> -->

    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">
            <!-- Login Form -->
            <div class="form-panel login-panel" #login>
                <div class="logo">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1>Welcome</h1>
                <p class="subtitle">Login to continue your knowledge on Cybersecurity</p>
                <form method="get">
                    <!-- Email -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="email" id="loginEmail" placeholder=" " autocomplete="email" required>
                        <label for="loginEmail">
                            Email Address
                        </label>
                    </div>
                    <!-- Password -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="loginPassword" placeholder=" " autocomplete="current-password"
                            required>
                        <label for="loginPassword">
                            Password
                        </label>
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
                            <i id="faIconLogin" class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <div class="options">
                        <label class="checkbox">
                            <input type="checkbox">
                            Remember me
                        </label>
                      <!-- <a href="#">
                            Forgot Password?
                        </a>    -->
                    </div>
                    <button type="submit" class="main-btn">
                        Login
                    </button>
                </form>

                <div class="switch-area">
                    <span>
                        Don't have an account?
                    </span>
                    <button type="button" class="switch-circle" id="to-signup">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>
    
            <!-- Sign Up -->
            <div class="form-panel signup-panel" id="signin">
                <div class="logo">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h1>Create Account</h1>
                <p class="subtitle">
                    Start your journey with us
                </p>

                <form action=#login method="get">  
                    <!-- Name -->
                     <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="name" placeholder=" " autocomplete="name" required>
                        <label for="name">
                            Your Name
                        </label>
                    </div>

                    <!-- Email -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="email" id="email" placeholder=" " autocomplete="email" required>
                        <label for="email">
                            Email Address
                        </label>
                    </div>

                    <!-- DOB -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="date" id="dob" placeholder=" " autocomplete="dob" required>
                        <label for="dob">
                            Date of Birth
                        </label>
                    </div>

                    <!-- Gender -->
                     <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <select id="gender" name="gender" required>
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                        <label for="gender">
                            Gender
                        </label>
                    </div>

                    <!-- District -->
                     <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="district" placeholder=" " autocomplete="District" required>
                        <label for="district">
                            District
                        </label>
                    </div>

                    <!-- Password --> 
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="signupPassword" placeholder=" " autocomplete="current-password" required>
                        <label for="signupPassword">
                            Password
                        </label>
                        <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', this)">
                            <i id="faIconSignup" class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <!-- Confirm -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="confirmPassword" placeholder=" " autocomplete="new-password"
                            required>
                        <label for="confirmPassword">
                           Confirm Password
                        </label>
                    </div>

                    <button type="submit" class="main-btn">CREATE ACCOUNT</button>
                </form>

                <div class="switch-area">
                    <span>
                        Already have an account?
                    </span>
                    <button type="button" class="switch-circle" id="to-login">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container"></div>
</body>
<script type="module" src="sign-in.js"></script>
</html>
